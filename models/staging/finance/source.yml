version: 2

sources:
  - name: raw_finance
    description: "Raw finance data landed from bank systems."
    database: FINANCE_PROJECT
    schema: dim

    freshness:
      warn_after: { count: 1, period: minute }
      error_after: { count: 9, period: hour }

    tables:
      - name: BANK_ACCOUNT
        description: "Dim bank accounts"
        loaded_at_field: staging_insert_time

        columns:
          - name: BANK_ID
            tests:
              - not_null

          - name: BANK_ACCOUNT_SK
            tests:
              - not_null
              - unique